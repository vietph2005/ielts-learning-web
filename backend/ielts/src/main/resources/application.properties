spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.frontend.url=${FRONTEND_URL:https://www.languages.io.vn}

cmudict.file.path=${CMUDICT_PATH:D:/archive/cmudict-0.7b.txt}
app.praat.path=${PRAAT_PATH:D:\\praat6438_win-intel64\\Praat.exe}
app.praat.script-path=${PRAAT_SCRIPT_PATH:D:\\SWP_Project4\\backend\\ielts\\src\\main\\java\\web\\ielts\\Test\\script.praat}
app.praat.stress-analysis-script-path=${STRESS_ANALYSIS_SCRIPT_PATH:D:\\SWP_Project4\\backend\\ielts\\src\\main\\java\\web\\ielts\\Test\\stressAnalysis.praat}
app.praat.intonation-script-path=${INTONATION_SCRIPT_PATH:D:\\SWP_Project4\\backend\\ielts\\src\\main\\java\\web\\ielts\\Test\\script_intonation.praat}
app.praat.get-duration-script-path=${GET_DURATION_SCRIPT_PATH:D:\\SWP_Project4\\backend\\ielts\\src\\main\\java\\web\\ielts\\Test\\GetDuration.praat}


# MongoDB Database URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ielts}

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:https://vtgwqleicwbaefsnpxxd.supabase.co}
supabase.key=${SUPABASE_KEY:}

# OpenAI API Key
openai.api.key=${OPENAI_API_KEY:}

spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Firebase Storage
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:projectsavefileandaudio.firebasestorage.app}
firebase.project.id=${FIREBASE_PROJECT_ID:projectsavefileandaudio}

# Microsoft Azure
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:eastus}
azure.speech.endpoint=${AZURE_SPEECH_ENDPOINT:https://eastus.api.cognitive.microsoft.com/}
azure.speech.profanity=Masked

# Email SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Secret
jwt.secret=${JWT_SECRET:}

# VnPay Configuration
vnPay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnPay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/vnpay-result}
vnPay.tmn-code=${VNPAY_TMN_CODE:}
vnPay.secret-key=${VNPAY_SECRET_KEY:}

server.port=${PORT:8080}
server.address=0.0.0.0

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://www.languages.io.vn,http://localhost:5173,https://ielts-learning-git-23004b-phamhoangviet05052005-9992s-projects.vercel.app}


management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=framework

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.boot.autoconfigure.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.client=DEBUG
logging.level.org.springframework.security.oauth2.client.registration=DEBUG