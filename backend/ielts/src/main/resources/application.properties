spring.application.name=ielts
spring.config.import=optional:classpath:application-local.properties

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
app.frontend.url=${FRONTEND_URL:https://www.languages.io.vn}

cmudict.file.path=${CMUDICT_PATH:D:/archive/cmudict-0.7b.txt}

# MongoDB Database URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ielts}

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:https://vtgwqleicwbaefsnpxxd.supabase.co}
supabase.key=${SUPABASE_KEY:}

# OpenAI API Key
openai.api.key=${OPENAI_API_KEY:}

spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Firebase Storage
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:projectsavefileandaudio.firebasestorage.app}
firebase.project.id=${FIREBASE_PROJECT_ID:projectsavefileandaudio}

# Microsoft Azure
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:eastus}
azure.speech.endpoint=${AZURE_SPEECH_ENDPOINT:https://eastus.api.cognitive.microsoft.com/}
azure.speech.profanity=Masked

# Email SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Secret
jwt.secret=${JWT_SECRET:}

# VnPay Configuration
vnPay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnPay.return-url=http://localhost:5173/vnpay-result
vnPay.tmn-code=${VNPAY_TMN_CODE:}
vnPay.secret-key=${VNPAY_SECRET_KEY:}

server.port=8080
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=framework

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.boot.autoconfigure.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.client=DEBUG
logging.level.org.springframework.security.oauth2.client.registration=DEBUG